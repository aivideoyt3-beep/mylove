<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>یه بازی کوچیک ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#fff0f6,#ffe0eb);display:flex;align-items:center;justify-content:center;color:#68163d}
.bg-heart{position:fixed;opacity:.13;font-size:35px;animation:float 7s linear infinite;pointer-events:none}
.card{width:min(92%,560px);min-height:430px;padding:38px 25px;border-radius:32px;text-align:center;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);box-shadow:0 25px 80px #9c3c6330;position:relative;z-index:2;animation:enter .6s}
.progress{height:7px;background:#f3dce6;border-radius:10px;margin-bottom:25px;overflow:hidden}.bar{height:100%;width:25%;background:#e91e63;border-radius:10px;transition:width .6s}
.emoji{font-size:68px;animation:pulse 1.2s infinite}.stage{font-size:13px;color:#a45c7c;margin-top:10px}
h1{font-size:29px;margin:12px 0;color:#86194c}p{font-size:17px;line-height:2;color:#77465d;min-height:52px}
.buttons{display:flex;justify-content:center;align-items:center;gap:18px;min-height:90px;margin-top:15px}
button{border:0;border-radius:17px;padding:14px 28px;font-family:inherit;font-size:17px;cursor:pointer;transition:.35s;touch-action:manipulation}
.yes{background:#e91e63;color:#fff;box-shadow:0 12px 28px #e91e6340}.no{background:#f1edf0;color:#555}
.yes:hover{transform:scale(1.06)}.hidden{display:none}
#meter{margin-top:20px;font-size:13px;color:#a04e72}.meterLine{height:8px;background:#f1d8e3;border-radius:10px;margin-top:7px;overflow:hidden}.meterFill{height:100%;width:30%;background:#e91e63;transition:.5s}
.success{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#ffb6d0,#ff5d9b 55%,#e91e63);color:#fff}.success.show{display:flex;animation:boom .8s}.successBox{padding:25px}.big{font-size:90px;animation:pulse .8s infinite}.success h2{font-size:43px;margin:8px}.success p{color:white;font-size:19px}.restart{background:white;color:#d51d60;margin-top:15px}
.shake{animation:shake .35s}.pop{animation:pop .45s}
.spark{position:fixed;top:-30px;z-index:30;animation:fall linear forwards;pointer-events:none}
.toast{position:fixed;z-index:10;top:20px;left:50%;transform:translateX(-50%);background:#fff;padding:12px 20px;border-radius:20px;box-shadow:0 8px 30px #0001;color:#7d194b;opacity:0;transition:.3s}.toast.show{opacity:1}
@keyframes pulse{50%{transform:scale(1.12)}}@keyframes enter{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.15)}}@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-8px)}75%{transform:translateX(5px)}}
@keyframes boom{0%{transform:scale(.1);opacity:0}65%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:0}}@keyframes float{to{transform:translateY(-110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="card" id="card">
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="stage" id="stage">مرحله ۱ از ۴</div>
  <div class="emoji" id="emoji">🎮</div>
  <h1 id="title">یه سؤال خیلی مهم دارم...</h1>
  <p id="text">امشب میای پابجی باهام؟ 😎❤️</p>
  <div class="buttons">
    <button class="yes" id="yes">آره، بزن بریم 🔥</button>
    <button class="no" id="no">نه 😐</button>
  </div>
  <div id="meter">درصد رضایت سیستم: <b id="percent">30%</b><div class="meterLine"><div class="meterFill" id="fill"></div></div></div>
</div>

<div class="success" id="success">
 <div class="successBox">
   <div class="big">💖</div>
   <h2>MISSION COMPLETED 🏆</h2>
   <p id="finalText">همه جواب‌ها ثبت شد... 😌❤️</p>
   <p>🎮 پابجی: قبول شد<br>❤️ دوستم داره: تأیید شد<br>💕 دوست‌دختر: تأیید شد<br>💍 قول موندن: تأیید شد</p>
   <button class="restart" onclick="location.reload()">دوباره از اول؟ 😈</button>
 </div>
</div>

<script>
const stages=[
 {emoji:"🎮",title:"یه سؤال مهم!",text:"امشب میای پابجی باهام؟ 😎❤️",yes:"آره، بزن بریم 🔥",no:"نه 😐"},
 {emoji:"❤️",title:"خب... حالا جدی‌تر",text:"دوستم داری؟ 🥺❤️",yes:"آره ❤️",no:"نه 😐"},
 {emoji:"💕",title:"یه سؤال خطرناک‌تر...",text:"دوست‌دخترم میشی؟ 😳💕",yes:"آره، میشم 🥰",no:"نه 😐"},
 {emoji:"💍",title:"و اما سؤال آخر...",text:"قول میدی کنارم بمونی؟ 🥹❤️",yes:"آره، قول میدم 💍",no:"نه 😐"}
];

let stage=0,noCount=0;

const $=id=>document.getElementById(id);
const yes=$("yes"),no=$("no"),card=$("card");

function render(){
 const s=stages[stage];
 $("stage").textContent=`مرحله ${stage+1} از ${stages.length}`;
 $("emoji").textContent=s.emoji;$("title").textContent=s.title;$("text").textContent=s.text;
 yes.textContent=s.yes;no.textContent=s.no;
 $("bar").style.width=((stage+1)/4*100)+"%";
 noCount=0;no.style.cssText="";yes.style.cssText="";
 $("percent").textContent=(30+stage*17)+"%";$("fill").style.width=(30+stage*17)+"%";
 card.classList.remove("pop");void card.offsetWidth;card.classList.add("pop");
}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1300)}
no.onclick=()=>{
 noCount++;
 const noScale=Math.max(.08,1-noCount*.14);
 const yesScale=Math.min(2.25,1+noCount*.18);
 no.style.transform=`scale(${noScale})`;
 no.style.opacity=Math.max(.18,1-noCount*.1);
 yes.style.transform=`scale(${yesScale})`;
 $("percent").textContent=Math.min(100,30+stage*17+noCount*7)+"%";
 $("fill").style.width=$("percent").textContent;
 card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
 const msgs=["مطمئنی؟ 🥺","یه بار دیگه فکر کن 😭","این جواب رو قبول ندارم 😂","داری قلبمو می‌شکنی 💔","دکمه نه داره آب میشه 😭","دیگه چیزی از نه نمونده 😂"];
 toast(msgs[Math.min(noCount-1,msgs.length-1)]);
 if(noCount>=6){no.style.pointerEvents="none";no.style.opacity=".08";toast("خب... فکر کنم جواب مشخصه 😏❤️")}
};
yes.onclick=()=>{
 if(stage<3){toast(["عههه پایه‌ای! 😎🎮","می‌دونستم ❤️","ایوللل 🥰"][stage]);stage++;setTimeout(render,650)}
 else finish();
};
function finish(){
 $("success").classList.add("show");
 const chars=["❤️","💖","💕","💗","✨","💘","🌸","🎉"];
 for(let i=0;i<110;i++){
  const x=document.createElement("span");x.className="spark";x.textContent=chars[Math.floor(Math.random()*chars.length)];
  x.style.left=Math.random()*100+"vw";x.style.animationDuration=2+Math.random()*4+"s";
  x.style.animationDelay=Math.random()*1.2+"s";x.style.fontSize=16+Math.random()*30+"px";
  document.body.appendChild(x);setTimeout(()=>x.remove(),6500);
 }
}
for(let i=0;i<16;i++){let h=document.createElement("div");h.className="bg-heart";h.textContent="❤";h.style.left=Math.random()*100+"vw";h.style.top=(70+Math.random()*50)+"vh";h.style.animationDelay=Math.random()*7+"s";document.body.appendChild(h)}
render();
</script>
</body>
</html>
